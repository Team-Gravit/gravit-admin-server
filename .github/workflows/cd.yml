name: CD

on:
  # PR 머지도 main push 이벤트로 들어온다. pull_request closed를 따로 걸면 같은 머지가 두 번 배포된다.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  # 이미지를 만들기 전에 서버 .env에 쓸 시크릿이 모두 있는지, .env에 그대로 쓸 수 있는 값인지 본다.
  # 여기서 실패하면 이미지도 올리지 않고 서버도 건드리지 않는다.
  deploy-env-check:
    name: 배포 시크릿 확인
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 시크릿 확인
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          ADMIN_API_PORT: ${{ secrets.ADMIN_API_PORT }}
          ADMIN_API_CPUS: ${{ secrets.ADMIN_API_CPUS }}
          ADMIN_API_MEMORY: ${{ secrets.ADMIN_API_MEMORY }}
          ADMIN_DB_URL: ${{ secrets.ADMIN_DB_URL }}
          ADMIN_DB_USERNAME: ${{ secrets.ADMIN_DB_USERNAME }}
          ADMIN_DB_PASSWORD: ${{ secrets.ADMIN_DB_PASSWORD }}
          MAIN_API_HOST: ${{ secrets.MAIN_API_HOST }}
          MAIN_DB_URL: ${{ secrets.MAIN_DB_URL }}
          MAIN_DB_USERNAME: ${{ secrets.MAIN_DB_USERNAME }}
          MAIN_DB_PASSWORD: ${{ secrets.MAIN_DB_PASSWORD }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # GitHub는 GITHUB_로 시작하는 시크릿 이름을 받지 않는다. 앱이 읽는 이름은 GITHUB_TOKEN 그대로다.
          GITHUB_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: bash .github/scripts/deploy-env.sh /dev/null

  build:
    name: 이미지 빌드, 푸시
    needs: [ci, deploy-env-check]
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/gravit-admin-server
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      # 테스트는 같은 실행의 ci job이 돌았다.
      - name: JAR 빌드
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar

      - name: 도커 허브 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # latest는 compose가 쓰고, 커밋 SHA 태그는 되돌리기용이다.
      - name: 도커 이미지 빌드
        run: docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .

      - name: 도커 이미지 푸시
        run: docker push --all-tags "$IMAGE"

  deploy:
    name: 앱센터 서버에 배포
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      # 서버 .env는 배포마다 GitHub Secrets 값으로 새로 쓴다(gravit-server 배포 단계와 같은 방식).
      # 비밀값을 이미지 안 설정 파일에 넣지 않는다. 저장소가 공개이고 이미지가 Docker Hub에 올라가기 때문이다.
      - name: 서버 .env 작성
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          ADMIN_API_PORT: ${{ secrets.ADMIN_API_PORT }}
          ADMIN_API_CPUS: ${{ secrets.ADMIN_API_CPUS }}
          ADMIN_API_MEMORY: ${{ secrets.ADMIN_API_MEMORY }}
          ADMIN_DB_URL: ${{ secrets.ADMIN_DB_URL }}
          ADMIN_DB_USERNAME: ${{ secrets.ADMIN_DB_USERNAME }}
          ADMIN_DB_PASSWORD: ${{ secrets.ADMIN_DB_PASSWORD }}
          MAIN_API_HOST: ${{ secrets.MAIN_API_HOST }}
          MAIN_DB_URL: ${{ secrets.MAIN_DB_URL }}
          MAIN_DB_USERNAME: ${{ secrets.MAIN_DB_USERNAME }}
          MAIN_DB_PASSWORD: ${{ secrets.MAIN_DB_PASSWORD }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # GitHub는 GITHUB_로 시작하는 시크릿 이름을 받지 않는다. 앱이 읽는 이름은 GITHUB_TOKEN 그대로다.
          GITHUB_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: bash .github/scripts/deploy-env.sh .env.deploy

      # rm 옵션을 켜면 대상 디렉터리를 비워 .env가 사라진다.
      - name: docker-compose.yml, .env 파일 전송
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.APPCENTER_SERVER_IP }}
          username: ${{ secrets.APPCENTER_SERVER_USERNAME }}
          password: ${{ secrets.APPCENTER_SERVER_PASSWORD }}
          port: ${{ secrets.APPCENTER_SERVER_PORT }}
          source: "docker-compose.yml,.env.deploy"
          target: "/home/serverking/gravit/qa"

      - name: admin-api 갱신
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        with:
          host: ${{ secrets.APPCENTER_SERVER_IP }}
          username: ${{ secrets.APPCENTER_SERVER_USERNAME }}
          password: ${{ secrets.APPCENTER_SERVER_PASSWORD }}
          port: ${{ secrets.APPCENTER_SERVER_PORT }}
          envs: DOCKER_HUB_USERNAME
          script: |
            set -eu
            cd /home/serverking/gravit/qa

            # 앞 step이 보낸 .env.deploy로 .env를 바꾼다. 직전 .env는 .env.prev로 한 벌 남긴다(되돌리기용).
            # 서버에서 .env를 손으로 고쳐도 다음 배포에서 덮어써진다. 값은 GitHub Secrets에서 바꾼다.
            if [ ! -f .env.deploy ]; then
              echo ".env.deploy가 전송되지 않았습니다."
              exit 1
            fi
            chmod 600 .env.deploy
            if [ -f .env ]; then
              cp -p .env .env.prev
            fi
            mv .env.deploy .env

            # deploy.resources.limits는 Compose v2에서만 적용된다.
            # 서버 로그인 셸(zsh)은 따옴표 없는 변수를 단어 분리하지 않아, 명령을 변수 대신 함수로 고른다.
            if docker compose version >/dev/null 2>&1; then
              compose() { docker compose "$@"; }
            elif docker-compose version --short 2>/dev/null | grep -q '^2'; then
              compose() { docker-compose "$@"; }
            else
              echo "Compose v2가 필요합니다."
              exit 1
            fi

            # LLM 게이트웨이(litellm-gw)와 통신할 외부 네트워크. 없으면 만들어 compose 기동이 막히지 않게 한다.
            docker network inspect llm-net >/dev/null 2>&1 || docker network create llm-net

            # --remove-orphans: 이 compose 파일에 없는 서비스의 컨테이너(옛 qa-api 등)를 새 컨테이너를 만들기 전에 지워 포트 충돌을 막는다.
            compose -f docker-compose.yml pull admin-api
            compose -f docker-compose.yml up -d --no-deps --force-recreate --remove-orphans admin-api

            # 저장소가 public이라 Actions 로그에 컨테이너 로그를 남기지 않는다. 원인은 서버에서 docker logs로 본다.
            i=0
            until [ "$(docker inspect -f '{{.State.Health.Status}}' gravit-admin-server)" = "healthy" ]; do
              i=$((i + 1))
              if [ "$i" -ge 36 ]; then
                echo "admin-api가 180초 안에 healthy가 되지 않았습니다. 서버에서 docker logs gravit-admin-server로 확인하세요."
                exit 1
              fi
              sleep 5
            done
            echo "admin-api healthy"

            docker image prune -f

      - name: 러너의 .env 사본 삭제
        if: always()
        run: rm -f .env.deploy
