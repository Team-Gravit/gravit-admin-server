name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  build:
    name: 이미지 빌드, 푸시
    needs: ci
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/gravit-admin-server
    steps:
      - name: 배포 시크릿 확인
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          ADMIN_API_PORT: ${{ secrets.ADMIN_API_PORT }}
          ADMIN_API_CPUS: ${{ secrets.ADMIN_API_CPUS }}
          ADMIN_API_MEMORY: ${{ secrets.ADMIN_API_MEMORY }}
          ADMIN_DB_URL: ${{ secrets.ADMIN_DB_URL }}
          ADMIN_DB_USERNAME: ${{ secrets.ADMIN_DB_USERNAME }}
          ADMIN_DB_PASSWORD: ${{ secrets.ADMIN_DB_PASSWORD }}
          MAIN_API_HOST: ${{ secrets.MAIN_API_HOST }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: |
          missing=""
          for key in DOCKER_HUB_USERNAME ADMIN_API_PORT ADMIN_API_CPUS ADMIN_API_MEMORY ADMIN_DB_URL ADMIN_DB_USERNAME ADMIN_DB_PASSWORD MAIN_API_HOST FIGMA_TOKEN NOTION_TOKEN GH_READ_TOKEN LITELLM_API_KEY; do
            [ -n "$(printenv "$key")" ] || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "비어 있거나 등록되지 않은 시크릿:$missing"
            exit 1
          fi

      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: application.yml 시크릿 주입
        uses: microsoft/variable-substitution@v1
        with:
          files: ./src/main/resources/application.yml
        env:
          spring.datasource.url: ${{ secrets.ADMIN_DB_URL }}
          spring.datasource.username: ${{ secrets.ADMIN_DB_USERNAME }}
          spring.datasource.password: ${{ secrets.ADMIN_DB_PASSWORD }}

          qa.auth.host: ${{ secrets.MAIN_API_HOST }}

          qa.adapter.github.token: ${{ secrets.GH_READ_TOKEN }}
          qa.adapter.notion.token: ${{ secrets.NOTION_TOKEN }}
          qa.adapter.figma.token: ${{ secrets.FIGMA_TOKEN }}
          qa.adapter.llm.api-key: ${{ secrets.LITELLM_API_KEY }}

      - name: JAR 빌드
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar

      - name: 도커 허브 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: 도커 이미지 빌드
        run: docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .

      - name: 도커 이미지 푸시
        run: docker push --all-tags "$IMAGE"

  deploy:
    name: 앱센터 서버에 배포
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: docker-compose.yml 파일 전송
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.APPCENTER_SERVER_IP }}
          username: ${{ secrets.APPCENTER_SERVER_USERNAME }}
          password: ${{ secrets.APPCENTER_SERVER_PASSWORD }}
          port: ${{ secrets.APPCENTER_SERVER_PORT }}
          source: "docker-compose.yml"
          target: "/home/serverking/gravit/qa"

      - name: admin-api 갱신
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          ADMIN_API_PORT: ${{ secrets.ADMIN_API_PORT }}
          ADMIN_API_CPUS: ${{ secrets.ADMIN_API_CPUS }}
          ADMIN_API_MEMORY: ${{ secrets.ADMIN_API_MEMORY }}
        with:
          host: ${{ secrets.APPCENTER_SERVER_IP }}
          username: ${{ secrets.APPCENTER_SERVER_USERNAME }}
          password: ${{ secrets.APPCENTER_SERVER_PASSWORD }}
          port: ${{ secrets.APPCENTER_SERVER_PORT }}
          envs: DOCKER_HUB_USERNAME,ADMIN_API_PORT,ADMIN_API_CPUS,ADMIN_API_MEMORY
          script: |
            set -eu
            cd /home/serverking/gravit/qa

            umask 077
            echo "DOCKER_HUB_USERNAME=$DOCKER_HUB_USERNAME" > .env
            echo "ADMIN_API_PORT=$ADMIN_API_PORT" >> .env
            echo "ADMIN_API_CPUS=$ADMIN_API_CPUS" >> .env
            echo "ADMIN_API_MEMORY=$ADMIN_API_MEMORY" >> .env

            if docker compose version >/dev/null 2>&1; then
              compose() { docker compose "$@"; }
            elif docker-compose version --short 2>/dev/null | grep -q '^2'; then
              compose() { docker-compose "$@"; }
            else
              echo "Compose v2가 필요합니다."
              exit 1
            fi

            docker network inspect llm-net >/dev/null 2>&1 || docker network create llm-net

            compose -f docker-compose.yml pull admin-api
            compose -f docker-compose.yml up -d --no-deps --force-recreate --remove-orphans admin-api

            i=0
            until [ "$(docker inspect -f '{{.State.Health.Status}}' gravit-admin-server)" = "healthy" ]; do
              i=$((i + 1))
              if [ "$i" -ge 36 ]; then
                echo "admin-api가 180초 안에 healthy가 되지 않았습니다. 서버에서 docker logs gravit-admin-server로 확인하세요."
                exit 1
              fi
              sleep 5
            done
            echo "admin-api healthy"

            docker image prune -f
